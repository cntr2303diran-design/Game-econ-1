name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Siapkan Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Siapkan Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Buat debug keystore (tidak disimpan di repo)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Uji unit
        continue-on-error: true
        run: |
          set +e
          gradle :app:testDebugUnitTest > test-output.txt 2>&1
          code=$?
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse(sys.argv[1]).getroot()
          for tc in t.iter('testcase'):
              for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fail.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title=Test gagal::{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          done
          if [ $code -ne 0 ]; then grep -E "What went wrong|error:|e: " -A3 test-output.txt | head -20 | sed 's/^/::warning::/'; fi
          exit $code

      - name: Beri nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/KAPITAL-${{ github.run_number }}-debug.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAPITAL-apk
          path: dist/*.apk

      - name: Terbitkan di halaman Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KAPITAL build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            APK debug otomatis dari commit ${{ github.sha }}.
            Unduh file .apk di bawah, buka di HP Android, lalu izinkan "Instal aplikasi tidak dikenal" jika diminta.
          files: dist/*.apk
