name: Build APK

on:
  push:
    branches: ["**", "!ci-hasil-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Dipakai pada kondisi 'if' langkah penandatanganan; kosong bila rahasia tidak dipasang (mis. pada pull request dari fork).
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Siapkan Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Siapkan Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Buat debug keystore (tidak disimpan di repo)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Uji unit (gagal bila ada tes gagal)
        run: |
          set +e
          gradle :app:testDebugUnitTest > test-output.txt 2>&1
          code=$?
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse(sys.argv[1]).getroot()
          for tc in t.iter('testcase'):
              for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fail.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title=Test gagal::{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          done
          if [ $code -ne 0 ]; then python3 tools/ci_gradle_errors.py test-output.txt 5; fi
          exit $code

      - name: Unggah log uji unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-uji-unit
          path: |
            test-output.txt
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Uji UI (Robolectric + Compose, grafik NATIVE, tangkapan layar)
        timeout-minutes: 30
        run: |
          set +e
          gradle :app:testDebugUnitTest -PuiOnly --stacktrace > ui-test-output.txt 2>&1
          code=$?
          python3 tools/ci_test_report.py "app/build/test-results/testDebugUnitTest/*.xml" "Uji UI (Robolectric + Compose)"
          if [ $code -ne 0 ]; then python3 tools/ci_gradle_errors.py ui-test-output.txt 5; fi
          exit $code

      - name: Kumpulkan hasil uji UI
        if: always()
        run: |
          mkdir -p uiout
          cp -r app/build/ui-shots uiout/ui-shots 2>/dev/null || true
          cp ui-test-output.txt uiout/ 2>/dev/null || true
          mkdir -p uiout/test-results
          cp app/build/test-results/testDebugUnitTest/*.xml uiout/test-results/ 2>/dev/null || true

      - name: Unggah hasil uji UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uji-ui
          path: uiout
          if-no-files-found: ignore

      - name: Verifikasi build release (R8) dengan kunci sementara
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-throwaway.jks
          STORE_PASSWORD: ci-throwaway
          KEY_PASSWORD: ci-throwaway
        run: |
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload \
            -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI Throwaway"
          gradle :app:assembleRelease --stacktrace
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          debug=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "### Ukuran APK"
            echo "- debug: $(stat -c%s "$debug") byte"
            echo "- release (R8, kunci sementara, TIDAK diterbitkan): $(stat -c%s "$apk") byte"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEYSTORE_PATH"

      - name: Build release bertanda tangan (hanya bila rahasia penandatanganan tersedia)
        if: env.RELEASE_KEYSTORE_B64 != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/KAPITAL-${{ github.run_number }}-release.apk
          rm -f "$KEYSTORE_PATH"

      - name: Beri nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/KAPITAL-${{ github.run_number }}-debug.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAPITAL-apk
          path: dist/*.apk

      - name: Terbitkan di halaman Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KAPITAL build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'main' }}
          body: |
            APK debug otomatis dari commit ${{ github.sha }} (APK release bertanda tangan hanya muncul bila rahasia penandatanganan dipasang di repositori).
            Unduh file .apk di bawah, buka di HP Android, lalu izinkan "Instal aplikasi tidak dikenal" jika diminta.
            Catatan rilis yang jujur (termasuk yang belum teruji): docs/RELEASE_NOTES.md.
          files: dist/*.apk

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/ci-throwaway.jks
      STORE_PASSWORD: ci-throwaway
      KEY_PASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Siapkan Android SDK bawaan runner
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36.1" "build-tools;36.0.0" || "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Siapkan Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Buat debug keystore dan kunci sementara release (tidak disimpan di repo)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload \
            -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI Throwaway"

      - name: Bangun APK debug, APK uji, dan APK release (R8)
        run: |
          mkdir -p emulator-out
          set +e
          gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace > emulator-out/gradle-build.log 2>&1
          code=$?
          tail -n 40 emulator-out/gradle-build.log
          if [ $code -ne 0 ]; then python3 tools/ci_gradle_errors.py emulator-out/gradle-build.log; fi
          exit $code

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan uji di emulator Android 14 (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci-emulator.sh

      - name: Laporan hasil emulator
        if: always()
        run: |
          {
            echo "### Emulator"
            cat emulator-out/device.txt 2>/dev/null
            echo
            echo '```'; cat emulator-out/status.txt 2>/dev/null; echo '```'
            echo "Ukuran APK (byte):"; echo '```'; cat emulator-out/apk-sizes.txt 2>/dev/null; echo '```'
            echo "Monkey pada APK release:"; echo '```'; cat emulator-out/monkey-ringkasan.txt 2>/dev/null; echo '```'
            echo "Muat simpanan akhir permainan (±380 bulan) dari proses dingin, kompilasi bawaan (jit) lalu AOT penuh (aot):"; echo '```'; cat emulator-out/cold-load.txt 2>/dev/null; echo '```'
            echo "Keluaran penting uji instrumented:"; echo '```'; cat emulator-out/art-logcat.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/parse_instrument.py emulator-out/instrument.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Unggah hasil emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-hasil
          path: emulator-out
          if-no-files-found: ignore

      - name: Gagalkan job bila ada pemeriksaan emulator yang gagal
        run: |
          cat emulator-out/status.txt
          ! grep -E "^(instrumented|release_install)=[^0]|^monkey_crash=1|^release_fatal=1|^release_alive_after_(start|monkey)=[^0]" emulator-out/status.txt

  hasil:
    needs: [build, emulator]
    if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Unduh hasil uji UI
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: uji-ui
          path: hasil/uji-ui

      - name: Unduh hasil emulator
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: emulator-hasil
          path: hasil/emulator

      - name: Unduh log uji unit
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: log-uji-unit
          path: hasil/uji-unit

      - name: Buang berkas lebih dari 5 MB
        run: find hasil -type f -size +5M -print -delete

      - name: Perkecil tangkapan layar
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob('hasil/**/*.png', recursive=True):
              try:
                  im = Image.open(p).convert('RGB')
                  im.thumbnail((720, 1500))
                  im.save(p[:-4] + '.jpg', 'JPEG', quality=72)
                  os.remove(p)
              except Exception as e:
                  print('gagal memperkecil', p, e)
          PY

      - name: Terbitkan ke cabang ci-hasil-<cabang> (untuk ditinjau; tidak ikut rilis)
        run: |
          branch="ci-hasil-${GITHUB_REF_NAME//\//-}"
          cd hasil
          echo "run ${{ github.run_number }}; commit ${{ github.sha }}; cabang ${GITHUB_REF_NAME}; status build=${{ needs.build.result }}, emulator=${{ needs.emulator.result }}" > INFO.txt
          git init -q -b ci-hasil
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Hasil uji run ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "ci-hasil:refs/heads/${branch}"
